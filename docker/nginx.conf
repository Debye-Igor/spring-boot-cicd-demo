# Nginx config para despliegue Blue-Green
# El "upstream active" define a cual contenedor se envia el trafico actualmente

events {
    worker_connections 1024;
}

http {

    # Upstream "active": apunta a la version actualmente en produccion
    # Para hacer un switch BLUE -> GREEN, se cambia esta linea y se recarga nginx
    upstream active {
        # server taskapi-blue:8080;
         server taskapi-green:8080;  # Comentar la linea de arriba y descomentar esta para hacer el switch a GREEN
    }

    # Servidor principal en puerto 80
    server {
        listen 80;
        server_name localhost;

        # Todas las peticiones se enrutan al upstream activo
        location / {
            proxy_pass http://active;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Endpoint que muestra a cual version se esta enrutando (util para debugging)
        location /nginx-status {
            access_log off;
            return 200 "nginx activo - enrutando a upstream 'active'\n";
            add_header Content-Type text/plain;
        }
    }
}