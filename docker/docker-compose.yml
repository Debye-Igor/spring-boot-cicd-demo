# Docker Compose para despliegue Blue-Green
# Levanta 2 versiones de la app (BLUE y GREEN) + nginx como router

services:

  # Version BLUE - inicialmente la "activa" en produccion
  taskapi-blue:
    image: taskapi:1.0.0
    container_name: taskapi-blue
    environment:
      - APP_VERSION=1.0.0-BLUE
      - SERVER_PORT=8080
    ports:
      - "8081:8080"
    networks:
      - bluegreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  # Version GREEN - version nueva en standby, lista para tomar el control
  taskapi-green:
    image: taskapi:1.0.0
    container_name: taskapi-green
    environment:
      - APP_VERSION=2.0.0-GREEN
      - SERVER_PORT=8080
    ports:
      - "8082:8080"
    networks:
      - bluegreen-net
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 3

  # Nginx - router que decide a cual version se envia el trafico
  nginx:
    image: nginx:alpine
    container_name: bluegreen-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    networks:
      - bluegreen-net
    depends_on:
      - taskapi-blue
      - taskapi-green
    restart: unless-stopped

networks:
  bluegreen-net:
    driver: bridge