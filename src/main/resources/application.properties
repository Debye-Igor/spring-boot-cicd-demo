spring.application.name=taskapi

# Puerto del servidor (lo cambiaremos por variable de entorno para Blue-Green)
server.port=${SERVER_PORT:8080}

# Versi\u00f3n de la app - clave para demostrar Blue-Green
app.version=${APP_VERSION:1.0.0-BLUE}

# Actuator: exponer endpoint /health para health checks
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always